plugins {
    id 'java-library'
}

group = 'consulting.stream.demo'
version = '0.1.0-SNAPSHOT'
description = 'Demo: stateful multi-sub-topology Kafka Streams app exercised with MultiPartitionTopologyTestDriver'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    testImplementation "consulting.stream:kafka-streams-multipart-test-utils:${multipartVersion}"
    testImplementation "org.apache.kafka:kafka-streams-test-utils:${kafkaVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-parameters']
}
